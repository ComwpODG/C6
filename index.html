<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galaxy Map (Canvas)</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h2 id="loadingText">Loading assets...</h2>
    <div id="appRoot">
        <canvas id="mapCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <canvas id="newsCanvas"></canvas>

        <div id="galaxyLabel">
            <div id="galaxyName"></div>
            <div id="galaxyDesc"></div>
        </div>


        <button id="authButton">
            <img src="assets/icons/login.png" />
        </button>

        <div class="slider">
            <img src="assets/icons/volumeSlider.png" id="volumeBG">
            <input type="range" min="0" max="1" value="0.3" step="0.01" id="volumeSlider">
        </div>

        <button id="loadButton">
            <img src="assets/icons/load.png" />
        </button>

        <button id="saveButton">
            <img src="assets/icons/save.png" />
        </button>

        <div id="crtOverlay"></div>

        <input type="text" id="textbox">
    </div>

    <select name="players" id="players">
        <option value="none">none</option>
        <option value="Kaelin">Kaelin</option>
        <option value="Europa">Europa</option>
        <option value="Sabered">Sabered</option>
        <option value="Aeonyx">Pygmy</option>
    </select>


    <script src="app.js"></script>
</body>
</html>
