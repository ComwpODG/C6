<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galaxy Map (Canvas)</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico?" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h2 id="loadingText">Loading assets...</h2>
    <div id="appRoot">
        <canvas id="mapCanvas" class="stdCanvas"></canvas>
        <canvas id="overlayCanvas" class="stdCanvas"></canvas>
        <canvas id="newsCanvas" class="stdCanvas"></canvas>

        <div id="galaxyLabel">
            <div id="galaxyName"></div>
            <div id="galaxyDesc"></div>
        </div>


        <button id="authButton" class="button hidden">
            <img src="assets/icons/login.png" />
        </button>

        <div class="slider hidden">
            <img src="assets/icons/volumeSlider.png" id="volumeBG">
            <input type="range" min="0" max="1" value="0.3" step="0.01" id="volumeSlider">
        </div>

        <button id="loadButton" class="button hidden">
            <img src="assets/icons/load.png" />
        </button>

        <button id="saveButton" class="button hidden">
            <img src="assets/icons/save.png" />
        </button>

        <div id="crtOverlay"></div>


        <div id="sectorEdit" style="display: none;">
            <select id="factions">
                <option value="">Uncontrolled</option>
            </select>        
        </div>

        <div id="tokenEdit" style="display: none;">
            <select id="tokenSprites">
                <option value="">WIP</option>
            </select>
            <input type="text" id="tokenName" placeholder="insert name" size="30"/>
            <input type="text" id="tokenDesc" placeholder="insert description" size="100"/>
        </div>

        <button id="editButton" class="hidden">
            Edit
        </button>
    </div>

    <select name="players" id="players" class="hidden">
        <option value="none">none</option>
    </select>


    <script src="app.js"></script>
</body>
</html>
