<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sheets test</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <button id="authorize_button">Authorize</button>
  <button id="read_button" disabled>Read Sheet Range</button>

  <pre id="output"></pre>

  <script>
    const CLIENT_ID = "571503823704-kurnmrskg05hgfkaqis8cmqmf65pljg3.apps.googleusercontent.com";
    const SHEET_ID = "1S-gIpNs-FL5PdXNg1y7oQrBfW9s4NfE8DsdmwscXifM";
    const RANGE = "Sheet1!A1:B2";

    const SCOPES = "https://www.googleapis.com/auth/spreadsheets.readonly";

    let tokenClient = null;
    let accessToken = null;

    const output = document.getElementById("output");
    const authButton = document.getElementById("authorize_button");
    const readButton = document.getElementById("read_button");

    function log(obj) {
      output.textContent =
        typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
    }

    window.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error) {
            console.error(resp);
            log(resp);
            return;
          }

          accessToken = resp.access_token;
          readButton.disabled = false;
          log("Authorization successful.");
        },
      });
    };

    authButton.onclick = () => {
      tokenClient.requestAccessToken();
    };

    readButton.onclick = async () => {
      if (!accessToken) {
        log("No access token yet.");
        return;
      }

      const url =
        `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/` +
        encodeURIComponent(RANGE);

      try {
        const res = await fetch(url, {
          headers: {
            Authorization: `Bearer ${accessToken}`,
          },
        });

        const data = await res.json();

        if (!res.ok) {
          console.error(data);
          log(data);
          return;
        }

        log(data);
      } catch (err) {
        console.error(err);
        log(String(err));
      }
    };
  </script>
</body>
</html>
